name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests with coverage
        # This historical Stage 2 audit guard requires commits that are not
        # available in the standard shallow Actions checkout.
        run: npm run test:coverage

      - name: Lint backend
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke and accessibility tests
        run: npm run test:e2e

  contract-tests:
    name: Smart contract checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      # Pin the toolchain used by the contract release process. Newer linkers
      # changed wasm undefined-import handling and are not reproducible here.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Install pinned NEAR contract builder
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build NEAR-compatible WASM
        run: |
          cargo near build non-reproducible-wasm --no-abi
          wasm_path=$(find target/near -type f -name 'agripartners.wasm' -print -quit)
          test -n "$wasm_path"
          mkdir -p target/wasm32-unknown-unknown/release
          cp "$wasm_path" target/wasm32-unknown-unknown/release/agripartners.wasm
      - run: cargo test
