[package]
name = "agripartners"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.5.0", features = ["unit-testing"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(not(windows))'.dev-dependencies]
near-workspaces = { version = "0.22", default-features = false, features = ["interop_sdk"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
