[package]
name = "agripartners"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5.0"

[dev-dependencies]
near-workspaces = { version = "0.14" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[[test]]
name = "integration"
path = "tests/integration.rs"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
